<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pollachi Coimbatore Pvt Ltd - Job Application</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("aHhRAUIO-YaMOrLp4"); // Replace with your public key
    })();
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 30px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background-color: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Job Application Form</h2>
  <form id="jobForm">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="date" name="dob" placeholder="Date of Birth" required>
    <input type="number" name="age" placeholder="Age" required>
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="text" name="phone" placeholder="Phone Number" required>
    <input type="text" name="address" placeholder="Full Address" required>
    <textarea name="experience" placeholder="Previous Experience (if any)" rows="4"></textarea>
    <textarea name="why" placeholder="Why should we hire you?" rows="4" required></textarea>
    <button type="submit">Apply Now</button>
  </form>
</div>

<script>
  document.getElementById('jobForm').addEventListener('submit', function(event) {
    event.preventDefault();

    emailjs.sendForm('service_sz6ss1t', 'template_u0ryxae', this)
      .then(() => {
        alert("Application sent successfully!");
        this.reset();
      }, (error) => {
        alert("Failed to send application. Try again.");
        console.error(error);
      });
  });
</script>

</body>
</html>
